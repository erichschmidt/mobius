[project]
name = "mobius"
version = "1.0.0"
description = "Turn a vague agent idea into an inspectable spec, then stop."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2",
]
authors = [{name = "Möbius contributors"}]
keywords = ["ai", "agents", "governance", "safety", "langgraph", "spec", "control-plane"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/erichschmidt/mobius"
Repository = "https://github.com/erichschmidt/mobius"
Issues = "https://github.com/erichschmidt/mobius/issues"
Changelog = "https://github.com/erichschmidt/mobius/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mobius = "mobius.cli:main"

[tool.setuptools.package-data]
mobius = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
